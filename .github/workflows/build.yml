
name: Android Build Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose and Build
        id: diagnose
        continue-on-error: true
        run: |
          set -x
          mkdir -p project logs

          echo "=== Repository files ==="
          ls -lah

          echo "=== Finding ZIP ==="
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          unzip -o "$ZIP" -d project

          echo "=== Project structure ==="
          find project -maxdepth 5 -type f | head -300

          echo "=== Finding Gradle wrapper ==="
          GRADLE=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLE" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          DIR=$(dirname "$GRADLE")
          chmod +x "$GRADLE"

          echo "=== Java version ==="
          java -version

          echo "=== Gradle build ==="
          cd "$DIR"
          ./gradlew assembleDebug --stacktrace --info

      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            project/
          if-no-files-found: warn
