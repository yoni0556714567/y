
name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o ./*.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle
        run: |
          GRADLE=$(find project -type f -name gradlew | head -1)
          if [ -z "$GRADLE" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 5 -type f
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$GRADLE")" >> $GITHUB_ENV
          chmod +x "$GRADLE"

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
