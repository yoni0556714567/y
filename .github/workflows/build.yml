
      - name: Locate Gradle
        run: |
          echo "=== ZIP CONTENTS ==="
          unzip -l ./*.zip

          echo "=== EXTRACTED PROJECT FILES ==="
          find project -maxdepth 7 -type f | head -200

          echo "=== BUILD CONFIGURATION FILES ==="
          find project -type f \( \
            -name "gradlew" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \)

          echo "=== ROOT DIRECTORIES ==="
          ls -lah project
